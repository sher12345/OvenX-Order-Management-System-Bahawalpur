<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oven X — Leave a Review</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  /* Samsung Galaxy Tab A6 10.1" optimizations:
     - Resolution: 1920x1200 (16:10)
     - PPI: 224
     - Physical size: ~10.1 inches
  */
  
  html {
    font-size: 18px; /* Base font size optimized for 10.1" viewing distance */
  }
  
  body { 
    background: #0d0000; 
    min-height: 100vh; 
    min-height: 100dvh;
    display: flex; 
    align-items: center; 
    justify-content: center; 
    font-family: 'Outfit', system-ui, sans-serif;
    padding: 40px;
  }
  
  .wrap { 
    background: #1a0000; 
    border-radius: 32px; 
    padding: 60px 50px 50px; 
    text-align: center; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    max-width: 720px; 
    width: 100%; 
    margin: 20px auto;
    box-shadow: 0 25px 80px rgba(0,0,0,0.6);
  }
  
  .icon-wrap {
    width: 100px;
    height: 100px;
    background: #c0392b;
    border-radius: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 32px;
    box-shadow: 0 8px 30px rgba(192, 57, 43, 0.3);
  }
  
  .icon-wrap svg {
    width: 50px;
    height: 50px;
  }
  
  .brand-label {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.35);
    margin-bottom: 16px;
  }
  
  h1 {
    font-size: 52px;
    font-weight: 900;
    color: white;
    line-height: 1.05;
    letter-spacing: -1.5px;
    margin-bottom: 18px;
  }
  
  .subtitle {
    color: rgba(255,255,255,0.55);
    font-size: 22px;
    line-height: 1.5;
    margin-bottom: 48px;
    max-width: 480px;
  }
  
  .qr-link {
    background: white;
    border-radius: 28px;
    padding: 28px;
    margin-bottom: 40px;
    display: inline-block;
    text-decoration: none;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  
  .qr-link:hover {
    transform: translateY(-2px);
    box-shadow: 0 15px 50px rgba(0,0,0,0.3);
  }
  
  .qr-link img {
    display: block;
    border-radius: 12px;
    width: 320px;
    height: 320px;
  }
  
  .divider {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 32px;
  }
  
  .divider-line {
    height: 1px;
    width: 100px;
    background: rgba(255,255,255,0.12);
  }
  
  .divider-text {
    font-size: 16px;
    color: rgba(255,255,255,0.35);
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  
  .cta-button {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: white;
    color: #1a1a1a;
    border-radius: 20px;
    padding: 24px 40px;
    font-size: 22px;
    font-weight: 700;
    text-decoration: none;
    width: 100%;
    max-width: 480px;
    margin-bottom: 36px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.15);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  
  .cta-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 40px rgba(0,0,0,0.25);
  }
  
  .cta-button svg {
    width: 28px;
    height: 28px;
  }
  
  .stars {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }
  
  .stars svg {
    width: 28px;
    height: 28px;
    fill: #f37021;
  }
  
  .help-text {
    color: rgba(255,255,255,0.3);
    font-size: 17px;
    margin-bottom: 40px;
  }
  
  .footer {
    border-top: 1px solid rgba(255,255,255,0.08);
    padding-top: 32px;
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  
  .footer-left {
    text-align: left;
  }
  
  .footer-logo {
    font-size: 24px;
    font-weight: 900;
    color: white;
    letter-spacing: -0.5px;
  }
  
  .footer-logo span {
    color: #f37021;
  }
  
  .footer-tagline {
    font-size: 14px;
    color: rgba(255,255,255,0.35);
    margin-top: 4px;
  }
  
  .footer-right {
    text-align: right;
  }
  
  .footer-location, .footer-url {
    font-size: 14px;
    color: rgba(255,255,255,0.35);
    margin-top: 4px;
  }
  
  /* Landscape orientation adjustments for Tab A6 */
  @media (orientation: landscape) and (max-height: 800px) {
    .wrap {
      padding: 40px 50px;
      max-width: 800px;
    }
    
    h1 {
      font-size: 44px;
    }
    
    .qr-link img {
      width: 260px;
      height: 260px;
    }
    
    .subtitle {
      font-size: 20px;
      margin-bottom: 32px;
    }
  }
  
  /* Ensure touch targets are large enough for tablet (min 48px) */
  a, button {
    min-height: 48px;
    min-width: 48px;
  }
</style>
</head>
